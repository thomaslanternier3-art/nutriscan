services:
  - type: web
    name: nutriscan
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nutriscan
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: OFF_CONTACT_EMAIL
        sync: false
